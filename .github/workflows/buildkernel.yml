name: Continues testing

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KBUILD_BUILD_USER: OnettBoots
      KBUILD_BUILD_HOST: OpeELA
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: kernel-build-cache
          restore-keys: |
            kernel-build-cache
          max-size: '10G'

      - name: Restore toolchain cache
        id: restore-clang
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/toolchains
          key: boolx-clang

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc \
            binutils-dev \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            cmake \
            curl \
            file \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            make \
            ninja-build \
            python3-dev \
            texinfo \
            u-boot-tools \
            xz-utils \
            zlib1g-dev \
            tar \
            curl \
            zip \
            megatools
          
          ccache --show-stats

      - name: Setup Boolx Clang 21.0.0
        if: steps.restore-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/onettboots/boolx-clang-build/releases/download/Boolx-21/boolx-clang21.tar.gz
          tar -xf boolx-clang21.tar.gz

      - name: Save clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        id: cache-clang-save
        uses: actions/cache/save@v4
        with:
          path: /home/runner/toolchains
          key: boolx-clang

      - name: Build the kernel with `ccache` 1
        run: |
          git config --global user.name ""
          git config --global user.email ""
          cd $HOME
          git clone https://github.com/2936410488/bool-x_xiaomi_raphael -b 14-HypeeMiui --depth 1 bool
          cd $HOME/bool
          bash build.sh




